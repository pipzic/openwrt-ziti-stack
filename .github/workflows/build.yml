name: build

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'LICENSE', 'NOTICE']
  workflow_dispatch:

permissions: {}

# Queue runs instead of cancelling: a cancelled deployment may already be live.
concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.read.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          . ./versions.env
          printf 'releases=%s\n' "$(printf '%s\n' $RELEASES | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # Runs third-party source, so this job gets no secrets.
  build:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.config.outputs.releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --platform linux/amd64 --tag openwrt-ziti-stack-builder .
      - name: Build packages
        run: |
          mkdir -p out
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD/out:/out" \
            openwrt-ziti-stack-builder \
            /opt/openwrt-ziti-stack/scripts/build.sh "${{ matrix.release }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.release }}
          path: out/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --platform linux/amd64 --tag openwrt-ziti-stack-builder .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apk-*
          merge-multiple: true
          path: feed
      - name: Sign the feed
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" --env HOME=/tmp --env APK_SIGNING_KEY \
            --volume "$PWD/feed:/feed" \
            openwrt-ziti-stack-builder \
            /opt/openwrt-ziti-stack/scripts/sign-feed.sh /feed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed
          path: feed/
          if-no-files-found: error

  # Installs and runs the packages, so this job gets no secrets either.
  test:
    needs: [config, sign]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.config.outputs.releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag openwrt-ziti-stack-builder .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feed
          path: feed
      - run: scripts/test.sh "${{ matrix.release }}" feed

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feed
          path: feed
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: feed
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
